<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="100%" height="100%" style="background-color: #0f172a; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <style>
      .wire-box { fill: #1e293b; stroke: #38bdf8; stroke-width: 1.5; stroke-dasharray: 4,4; rx: 6px; }
      .solid-box { fill: #1e293b; stroke: #475569; stroke-width: 1.5; rx: 6px; }
      .header-box { fill: #0f172a; stroke: #6366f1; stroke-width: 2; rx: 6px; }
      .accent-box { fill: #312e81; stroke: #818cf8; stroke-width: 1.5; rx: 6px; }
      .title { fill: #f8fafc; font-size: 18px; font-weight: bold; }
      .subtitle { fill: #94a3b8; font-size: 13px; }
      .label { fill: #38bdf8; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
      .tag { fill: #cbd5e1; font-size: 11px; }
      .badge { fill: #4f46e5; rx: 12px; }
      .badge-text { fill: #ffffff; font-size: 11px; font-weight: bold; }
