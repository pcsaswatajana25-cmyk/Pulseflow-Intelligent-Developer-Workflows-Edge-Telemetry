    <rect x="25" y="414" width="280" height="36" class="solid-box" />
    <text x="35" y="435" fill="#a78bfa" font-size="10" font-weight="bold">📊 Real-Time Metrics (Card 2)</text>
    <rect x="25" y="456" width="280" height="32" class="solid-box" />
    <text x="35" y="476" fill="#34d399" font-size="10" font-weight="bold">🛡️ Enterprise Security (Card 3)</text>

